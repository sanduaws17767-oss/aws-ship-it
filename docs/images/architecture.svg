<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111">aws-ship-it — how one change travels from my laptop to AWS</text>

  <!-- GitHub band -->
  <rect x="20" y="60" width="1160" height="300" rx="12" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="40" y="88" font-size="16" font-weight="700" fill="#1f6feb">GITHUB</text>

  <!-- laptop -->
  <rect x="40" y="120" width="170" height="90" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="125" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#111">My laptop</text>
  <text x="125" y="174" text-anchor="middle" font-size="13" fill="#333">new branch</text>
  <text x="125" y="193" text-anchor="middle" font-size="13" fill="#333">git push</text>

  <!-- PR -->
  <rect x="250" y="120" width="170" height="90" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="2"/>
  <text x="335" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Pull request</text>
  <text x="335" y="174" text-anchor="middle" font-size="13" fill="#333">main is protected:</text>
  <text x="335" y="193" text-anchor="middle" font-size="13" fill="#333">no direct pushes</text>

  <!-- test job -->
  <rect x="460" y="105" width="260" height="120" rx="10" fill="#e8f7ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="590" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#0b6b4a">TEST job</text>
  <text x="590" y="157" text-anchor="middle" font-size="13" fill="#222">1. ruff (code style check)</text>
  <text x="590" y="177" text-anchor="middle" font-size="13" fill="#222">2. pytest (11 tests)</text>
  <text x="590" y="197" text-anchor="middle" font-size="13" fill="#222">3. sam validate --lint (template)</text>
  <text x="590" y="216" text-anchor="middle" font-size="12" fill="#555">about 20 seconds</text>

  <!-- blocked -->
  <rect x="770" y="100" width="190" height="70" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="865" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5300">Any test fails</text>
  <text x="865" y="150" text-anchor="middle" font-size="13" fill="#333">merge button blocked</text>

  <!-- merged -->
  <rect x="770" y="190" width="190" height="70" rx="10" fill="#e8f7ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="865" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b4a">All green</text>
  <text x="865" y="240" text-anchor="middle" font-size="13" fill="#333">I merge into main</text>

  <!-- deploy job -->
  <rect x="990" y="120" width="170" height="220" rx="10" fill="#f3ecff" stroke="#6f42c1" stroke-width="2"/>
  <text x="1075" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#4b2a8a">DEPLOY job</text>
  <text x="1075" y="170" text-anchor="middle" font-size="12" fill="#555">only after merge to main</text>
  <text x="1075" y="198" text-anchor="middle" font-size="13" fill="#222">1. keyless login (OIDC)</text>
  <text x="1075" y="222" text-anchor="middle" font-size="13" fill="#222">2. sam build</text>
  <text x="1075" y="246" text-anchor="middle" font-size="13" fill="#222">3. sam deploy</text>
  <text x="1075" y="270" text-anchor="middle" font-size="13" fill="#222">4. smoke test on</text>
  <text x="1075" y="288" text-anchor="middle" font-size="13" fill="#222">the live API</text>
  <text x="1075" y="318" text-anchor="middle" font-size="12" fill="#555">no stored AWS keys</text>

  <line x1="210" y1="165" x2="246" y2="165" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="165" x2="456" y2="165" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="150" x2="766" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="190" x2="766" y2="222" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="960" y1="225" x2="986" y2="225" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- AWS band -->
  <rect x="20" y="390" width="1160" height="350" rx="12" fill="#fff6ea" stroke="#e07b00" stroke-width="2"/>
  <text x="40" y="418" font-size="16" font-weight="700" fill="#b35f00">AWS — London (eu-west-2)</text>

  <!-- IAM -->
  <rect x="930" y="440" width="230" height="110" rx="10" fill="#fff" stroke="#6f42c1" stroke-width="2"/>
  <text x="1045" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#4b2a8a">IAM role</text>
  <text x="1045" y="490" text-anchor="middle" font-size="13" fill="#222">github-deploy-billguard</text>
  <text x="1045" y="512" text-anchor="middle" font-size="12" fill="#333">trusts only my repo, main branch</text>
  <text x="1045" y="532" text-anchor="middle" font-size="12" fill="#333">can only touch billguard-* things</text>
  <line x1="1075" y1="340" x2="1075" y2="436" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="1085" y="395" font-size="12" fill="#333">1-hour pass</text>

  <!-- CloudFormation -->
  <rect x="60" y="440" width="820" height="280" rx="10" fill="#ffffff" stroke="#e07b00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="80" y="466" font-size="15" font-weight="700" fill="#b35f00">CloudFormation stack: billguard-staging (built from template.yaml)</text>
  <line x1="930" y1="495" x2="884" y2="495" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- resources -->
  <rect x="90" y="495" width="170" height="80" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="175" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#111">HTTP API</text>
  <text x="175" y="547" text-anchor="middle" font-size="12" fill="#333">API Gateway</text>
  <text x="175" y="564" text-anchor="middle" font-size="12" fill="#333">POST /calculate</text>

  <rect x="310" y="495" width="190" height="80" rx="8" fill="#fff" stroke="#e07b00" stroke-width="2"/>
  <text x="405" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Lambda function</text>
  <text x="405" y="547" text-anchor="middle" font-size="12" fill="#333">Python 3.14 · 128 MB</text>
  <text x="405" y="564" text-anchor="middle" font-size="12" fill="#333">works out the bill</text>

  <rect x="550" y="495" width="190" height="80" rx="8" fill="#e8f7ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="645" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#111">DynamoDB table</text>
  <text x="645" y="547" text-anchor="middle" font-size="12" fill="#333">pay-per-request</text>
  <text x="645" y="564" text-anchor="middle" font-size="12" fill="#333">counts visits</text>

  <rect x="310" y="610" width="190" height="80" rx="8" fill="#f5f5f5" stroke="#555" stroke-width="2"/>
  <text x="405" y="640" text-anchor="middle" font-size="14" font-weight="700" fill="#111">CloudWatch</text>
  <text x="405" y="662" text-anchor="middle" font-size="12" fill="#333">logs kept 14 days</text>
  <text x="405" y="679" text-anchor="middle" font-size="12" fill="#333">alarm: 1+ error in 60s</text>

  <rect x="550" y="610" width="190" height="80" rx="8" fill="#f3ecff" stroke="#6f42c1" stroke-width="2"/>
  <text x="645" y="640" text-anchor="middle" font-size="14" font-weight="700" fill="#111">SNS topic</text>
  <text x="645" y="662" text-anchor="middle" font-size="12" fill="#333">emails me</text>
  <text x="645" y="679" text-anchor="middle" font-size="12" fill="#333">when the alarm fires</text>

  <line x1="260" y1="535" x2="306" y2="535" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="535" x2="546" y2="535" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="405" y1="575" x2="405" y2="606" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="650" x2="546" y2="650" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- smoke test arrow into API -->
  <path d="M990,300 C 700,370 250,380 175,491" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <rect x="352" y="368" width="416" height="20" rx="4" fill="#ffffff" stroke="#6f42c1" stroke-width="1"/>
  <text x="560" y="382" text-anchor="middle" font-size="12" fill="#4b2a8a">smoke test asks one known question → expects HTTP 200 and total 8.85</text>
</svg>
